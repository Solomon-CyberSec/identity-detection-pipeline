# datamodel.conf - CIM Authentication Datamodel Mapping for Azure AD
# Purpose: Accelerate Splunk CIM Authentication datamodel with Azure AD identity data
# Place in: $SPLUNK_HOME/etc/apps/<your_app>/local/datamodel.conf

# ============================================================
# Authentication Datamodel Acceleration
# ============================================================
[authentication]
acceleration = true
acceleration.earliest_time = -7d
acceleration.cron_schedule = */5 * * * *
acceleration.max_time = 60

# ============================================================
# CIM Authentication Field Mapping - Azure AD Sign-in Logs
# ============================================================
# Sourcetype: azure:aad:signin
#
# CIM Field          --> Azure AD Field
# -----------------------------------------------
# action             --> ResultType (0=success, else failure)
# app                --> AppDisplayName
# dest               --> ResourceDisplayName
# signature          --> ResultDescription
# src                --> IPAddress
# src_ip             --> IPAddress
# user               --> UserPrincipalName
# user_agent         --> userAgent
# vendor_account     --> tenantId
#
# Additional Identity Fields:
# Location           --> location.city + location.countryOrRegion
# ClientAppUsed      --> clientAppUsed (legacy auth detection)
# ConditionalAccessStatus --> conditionalAccessStatus
# RiskLevelDuringSignIn   --> riskLevelDuringSignIn

# ============================================================
# CIM Authentication Field Mapping - Windows Event Logs
# ============================================================
# Sourcetype: wineventlog
#
# CIM Field          --> Windows Field
# -----------------------------------------------
# action             --> Keywords (Audit Success/Failure)
# dest               --> ComputerName
# signature          --> Message
# signature_id       --> EventCode
# src                --> IpAddress
# src_ip             --> IpAddress
# user               --> TargetUserName
# user_domain        --> TargetDomainName
# vendor_account     --> SubjectUserName

# ============================================================
# Index Constraints for Acceleration
# ============================================================
# Accelerate only relevant indexes for performance
# Add to your data model XML in Splunk Web:
#   (index=azure sourcetype=azure:aad:signin)
#   OR (index=azure sourcetype=azure:aad:audit)
#   OR (index=wineventlog EventCode IN (4624,4625,4648,4768,4769,4776))

# ============================================================
# Notes
# ============================================================
# 1. Data model acceleration significantly improves detection search performance.
# 2. Use tstats command in SPL detections for accelerated searches:
#    | tstats count FROM datamodel=Authentication WHERE ...
# 3. Ensure the Authentication datamodel is mapped in Splunk CIM settings.
# 4. Review CIM compatibility with the Splunk Add-on for Microsoft Azure.
