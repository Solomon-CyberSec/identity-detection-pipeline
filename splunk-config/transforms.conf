# transforms.conf - Field Extractions and Lookups for Identity Detections
# Purpose: Define field aliases, extractions, and lookup tables for Azure AD log normalization
# Place in: $SPLUNK_HOME/etc/apps/<your_app>/local/transforms.conf

# ============================================================
# Field Aliases - Azure AD Sign-in Logs
# Map Azure AD field names to Splunk CIM Authentication fields
# ============================================================
[azure_signin_field_aliases]
STATSALIAS-user = UserPrincipalName
STATSALIAS-src = IPAddress
STATSALIAS-app = AppDisplayName
STATSALIAS-action = ResultType
STATSALIAS-signature = ResultDescription

# ============================================================
# Field Extractions - Azure AD Result Codes
# ============================================================
[azure_result_code_lookup]
filename = azure_result_codes.csv
default_match = Unknown
min_matches = 1

# CSV file format (azure_result_codes.csv):
# ResultType,result_description,result_category
# 0,Success,success
# 50053,Account locked,failure
# 50126,Invalid credentials,failure
# 50076,MFA required,failure
# 53003,Conditional Access blocked,failure
# 70011,Invalid scope,failure

# ============================================================
# Field Extraction - Extract Location from Azure AD nested JSON
# ============================================================
[extract_azure_location]
SOURCE_KEY = _raw
REGEX = "location"\s*:\s*\{[^}]*"city"\s*:\s*"(?<City>[^"]+)"[^}]*"countryOrRegion"\s*:\s*"(?<Country>[^"]+)"

# ============================================================
# Field Extraction - Extract Device Info
# ============================================================
[extract_azure_device]
SOURCE_KEY = _raw
REGEX = "deviceDetail"\s*:\s*\{[^}]*"operatingSystem"\s*:\s*"(?<OS>[^"]+)"[^}]*"browser"\s*:\s*"(?<Browser>[^"]+)"

# ============================================================
# Lookup - High Risk IP Ranges
# ============================================================
[high_risk_ip_lookup]
filename = high_risk_ips.csv
default_match = false
min_matches = 1

# ============================================================
# Lookup - Privileged Azure AD Roles
# ============================================================
[privileged_roles_lookup]
filename = privileged_roles.csv
default_match = false
min_matches = 1

# CSV file format (privileged_roles.csv):
# role_name,is_privileged,risk_level
# Global Administrator,true,Critical
# Privileged Role Administrator,true,Critical
# Security Administrator,true,High
# Exchange Administrator,true,High
# SharePoint Administrator,true,High
# Compliance Administrator,true,Medium
# User Administrator,true,Medium
