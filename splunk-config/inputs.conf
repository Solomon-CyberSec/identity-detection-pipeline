# inputs.conf - Splunk Azure AD / Entra ID Log Ingestion
# Purpose: Configure Splunk to ingest Azure AD sign-in and audit logs
# Place this file in: $SPLUNK_HOME/etc/apps/<your_app>/local/inputs.conf

# ============================================================
# Azure AD Sign-in Logs via HTTP Event Collector (HEC)
# ============================================================
[http://azure_aad_signin]
token = <YOUR_HEC_TOKEN_HERE>
index = azure
sourcetype = azure:aad:signin
disabled = false

# ============================================================
# Azure AD Audit Logs via HTTP Event Collector (HEC)
# ============================================================
[http://azure_aad_audit]
token = <YOUR_HEC_TOKEN_HERE>
index = azure
sourcetype = azure:aad:audit
disabled = false

# ============================================================
# Microsoft 365 Management Activity Logs
# ============================================================
[http://o365_management]
token = <YOUR_HEC_TOKEN_HERE>
index = o365
sourcetype = o365:management:activity
disabled = false

# ============================================================
# Windows Security Event Logs (on-prem AD)
# ============================================================
[WinEventLog://Security]
index = wineventlog
sourcetype = wineventlog
start_from = oldest
current_only = 0
disabled = false
evt_resolve_ad_obj = 1

# Filter to identity-relevant Event IDs only:
# 4624 - Successful logon
# 4625 - Failed logon
# 4648 - Logon using explicit credentials
# 4720 - User account created
# 4728 - Member added to security group
# 4732 - Member added to local group
# 4756 - Member added to universal group
# 4768 - Kerberos TGT request
# 4769 - Kerberos service ticket request
# 4776 - NTLM authentication
whitelist = 4624,4625,4648,4720,4728,4732,4756,4768,4769,4776

# ============================================================
# Notes
# ============================================================
# 1. For Azure AD logs, configure Diagnostic Settings in Azure Portal
#    to export to an Event Hub, then use the Splunk Add-on for Microsoft Cloud Services.
# 2. HEC tokens must be created in Splunk Settings > Data Inputs > HTTP Event Collector.
# 3. Ensure the 'azure' and 'o365' indexes are created before enabling inputs.
# 4. For production, use Splunk Add-on for Microsoft Azure (TA-microsoft-azure) instead of raw HEC.
